# File and Directory Paths
project_name: sf20k
run_name: full
output_dir: ./results/full/
weights_dir: /geovic/ghermi/weights/
train_data_path: /users/ghermi/code/sf20k/data/train.csv
test_data_path: /users/ghermi/code/sf20k/data/test_expert.csv
video_dir: /geovic/geovic/SF20K/videos/
train_subtitles_path: /geovic/geovic/SF20K/subtitles.parquet
test_subtitles_path: /users/ghermi/code/sf20k/data/test_subtitles.csv

# Dataset Parameters
n_subsample_train: 1024
n_subsample_test: 256

# Model Parameters
model_name: qwen3-vl-2b
adapter_path: null
load_in_4bit: false
modality: vision_language
fps: 1.0
max_frames: 32

# LoRA Configuration
lora_r: 8
lora_alpha: 16
lora_dropout: 0.05

# Training Arguments
num_train_epochs: 1
