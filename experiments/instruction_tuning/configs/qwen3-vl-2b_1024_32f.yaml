per_device_train_batch_size: 1
per_device_eval_batch_size: 4
optim: adamw_torch_fused
learning_rate: 0.0001
lr_scheduler_type: cosine
max_grad_norm: 0.3
warmup_ratio: 0.03
max_length: null

# Miscellaneous
logging_steps: 1
eval_steps: 20000
save_steps: 512
generation_log_steps: 512
num_gens_to_log: 5
seed: 42